<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life-Fit Setup</title>
    <style>
        body {
            background-color: #0a0c10;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 4rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }
        .logo {
            display: flex;
            align-items: center;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: white;
            text-decoration: none;
        }
        .logo svg {
            width: 32px;
            height: 32px;
            margin-right: 12px;
        }
        .skip-link {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s;
        }
        .skip-link:hover { color: white; }
        .wizard-container {
            flex: 1;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-sizing: border-box;
        }
        .step-ind {
            color: #3b82f6;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .step-title {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }
        .step-why {
            font-size: 1.1rem;
            color: #94a3b8;
            font-style: italic;
            margin-bottom: 3rem;
            line-height: 1.5;
        }
        .city-card {
            padding: 1.5rem;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            margin-bottom: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .city-card.active {
            border-color: #3b82f6;
            background-color: rgba(59,130,246,0.1);
        }
        .city-card.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }
        .city-name { font-size: 1.25rem; font-weight: 600; }
        .coming-soon { font-size: 0.8rem; background: rgba(255,255,255,0.1); padding: 0.2rem 0.6rem; border-radius: 12px; }
        .person-row { display: flex; gap: 1rem; margin-bottom: 1rem; align-items: center; }
        .person-row input {
            flex: 1;
            padding: 0.8rem;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.2);
            color: white;
            font-size: 1rem;
        }
        .btn-add {
            background: none;
            border: 1px dashed rgba(255,255,255,0.3);
            color: #94a3b8;
            padding: 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 0.5rem;
            margin-bottom: 2rem;
            font-size: 1rem;
            transition: all 0.2s;
        }
        .btn-add:hover { color: white; border-color: rgba(255,255,255,0.5); }
        .btn-remove { background: none; border: none; color: #ef4444; font-size: 1.5rem; cursor: pointer; padding: 0 0.5rem; transition: transform 0.2s; }
        .btn-remove:hover { transform: scale(1.1); }
        .footer {
            display: flex;
            justify-content: space-between;
            margin-top: 4rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .btn {
            padding: 0.8rem 2rem;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }
        .btn-primary { background-color: #3b82f6; color: white; }
        .btn-primary:hover { background-color: #2563eb; }
        .btn-secondary { background-color: transparent; color: #cbd5e1; border: 1px solid rgba(255,255,255,0.2); }
        .btn-secondary:hover { background-color: rgba(255,255,255,0.05); color: white; }
        h3 { margin-bottom: 1rem; font-size: 1.25rem; font-weight: 600; color: #e2e8f0; }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="45" fill="none" stroke="#3b82f6" stroke-width="8"/>
                <path d="M50 20 L50 80 M20 50 L80 50" stroke="#3b82f6" stroke-width="8" stroke-linecap="round"/>
                <circle cx="30" cy="30" r="8" fill="#eab308"/>
                <circle cx="70" cy="70" r="10" fill="#ef4444"/>
                <circle cx="75" cy="35" r="6" fill="#8b5cf6"/>
            </svg>
            Life-Fit
        </div>
        <a href="#" class="skip-link" onclick="skipWizard(); return false;">Skip - use a demo household</a>
    </header>

    <div class="wizard-container" id="wizard-container">
        <!-- Rendered by JS -->
    </div>

    <script>
        let wizState = {
            step: 1,
            city: 'Bengaluru',
            adults: [{ name: '' }],
            children: []
        };

        function render() {
            const container = document.getElementById('wizard-container');
            let html = '<div class="step-ind">Step ' + wizState.step + ' of 6</div>';
            
            if (wizState.step === 1) {
                html += '<h2 class="step-title">Which city?</h2>';
                html += '<div class="step-why">Locality data differs by city. We start where ours is deepest.</div>';
                
                html += '<div class="city-card active"><span class="city-name">Bengaluru</span></div>';
                ['Mumbai', 'Delhi NCR', 'Hyderabad', 'Pune'].forEach(city => {
                    html += '<div class="city-card disabled"><span class="city-name">' + city + '</span><span class="coming-soon">coming soon</span></div>';
                });
            } else if (wizState.step === 2) {
                html += '<h2 class="step-title">Who is moving?</h2>';
                html += '<div class="step-why">Each person adds a destination. A home that works for one adult often fails the whole household.</div>';
                
                html += '<h3>Adults</h3>';
                wizState.adults.forEach((a, i) => {
                    html += '<div class="person-row"><input type="text" placeholder="Optional - we don\\'t need it" value="' + a.name + '" onchange="updatePerson(\\'adults\\', ' + i + ', this.value)"><button class="btn-remove" onclick="removePerson(\\'adults\\', ' + i + ')">&times;</button></div>';
                });
                html += '<button class="btn-add" onclick="addPerson(\\'adults\\')">+ Add Adult</button>';
                
                html += '<h3>Children</h3>';
                wizState.children.forEach((c, i) => {
                    html += '<div class="person-row"><input type="text" placeholder="Optional - we don\\'t need it" value="' + c.name + '" onchange="updatePerson(\\'children\\', ' + i + ', this.value)"><button class="btn-remove" onclick="removePerson(\\'children\\', ' + i + ')">&times;</button></div>';
                });
                html += '<button class="btn-add" onclick="addPerson(\\'children\\')">+ Add Child</button>';
            }
            
            html += '<div class="footer">';
            if (wizState.step > 1) {
                html += '<button class="btn btn-secondary" onclick="prevStep()">Back</button>';
            } else {
                html += '<div></div>';
            }
            
            if (wizState.step === 2) {
                html += '<button class="btn btn-primary" onclick="alert(\\'Steps 3-6 coming next\\')">Next</button>';
            } else {
                html += '<button class="btn btn-primary" onclick="nextStep()">Next</button>';
            }
            html += '</div>';
            
            container.innerHTML = html;
        }

        function nextStep() { wizState.step++; render(); }
        function prevStep() { wizState.step--; render(); }
        function addPerson(group) { wizState[group].push({ name: '' }); render(); }
        function removePerson(group, idx) { wizState[group].splice(idx, 1); render(); }
        function updatePerson(group, idx, val) { wizState[group][idx].name = val; }
        
        function skipWizard() {
            localStorage.removeItem('lifefit_state');
            window.location.href = 'app.html';
        }

        render();
    </script>
</body>
</html>
