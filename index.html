<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life-Fit: Find Your Perfect Bengaluru Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="panel left-panel">
        <h1>Life-Fit</h1>
        <p style="margin-bottom: 2rem; color: #666;">Configure your priorities to rank properties.</p>

        <div class="form-group">
            <label for="budget">Monthly Budget (₹)</label>
            <input type="number" id="budget" value="50000" step="1000">
        </div>

        <div class="form-group">
            <label for="office">Office Location (Lat, Lon)</label>
            <input type="text" id="office" placeholder="e.g. 12.9716, 77.5946" value="12.9345, 77.6265">
            <small style="color:#888;">Default: Koramangala area</small>
        </div>

        <div class="form-group">
            <label for="school">Child's School Location (Lat, Lon)</label>
            <input type="text" id="school" placeholder="Optional">
        </div>

        <h2 style="margin-top: 2rem; font-size: 1.25rem;">Priorities</h2>
        
        <div class="slider-group">
            <div class="slider-header">
                <span>Commute</span>
                <span class="slider-value" id="val-commute">5</span>
            </div>
            <input type="range" id="commute" min="0" max="10" value="5">
        </div>

        <div class="slider-group">
            <div class="slider-header">
                <span>Schools</span>
                <span class="slider-value" id="val-schools">5</span>
            </div>
            <input type="range" id="schools" min="0" max="10" value="5">
        </div>

        <div class="slider-group">
            <div class="slider-header">
                <span>Healthcare</span>
                <span class="slider-value" id="val-healthcare">5</span>
            </div>
            <input type="range" id="healthcare" min="0" max="10" value="5">
        </div>

        <div class="slider-group">
            <div class="slider-header">
                <span>Daily convenience</span>
                <span class="slider-value" id="val-convenience">5</span>
            </div>
            <input type="range" id="convenience" min="0" max="10" value="5">
        </div>

        <div class="slider-group">
            <div class="slider-header">
                <span>Cost</span>
                <span class="slider-value" id="val-cost">5</span>
            </div>
            <input type="range" id="cost" min="0" max="10" value="5">
        </div>
    </div>

    <div class="panel right-panel">
        <div id="summary-line" style="margin-bottom: 20px; font-weight: 500; color: #444;"></div>
        <div class="property-list" id="property-list">
            <!-- Properties will be injected here by JS -->
            <p>Loading properties...</p>
        </div>
    </div>

    <script src="properties.js"></script>
    <script src="scoring.js"></script>
    <script src="app.js"></script>
</body>
</html>
